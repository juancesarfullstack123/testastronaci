services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: testingapp
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/vouchers.db
    volumes:
      - vouchers-db:/var/www/html/database

volumes:
  vouchers-db:
